services:
  ollama:
    image: ollama/ollama:latest
    container_name: brain-tumor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    container_name: brain-tumor-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "llama3"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  weaviate:
    image: semitechnologies/weaviate:1.28.2
    container_name: brain-tumor-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: brain-tumor-ui
    ports:
      - "8501:8501"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data:ro
      - dynunet_weights:/workspace/dynunet_weights
      - model_cache:/root/.cache
      - nilearn_data:/root/nilearn_data
    environment:
      - OUTPUT_DIR=/app/outputs
      - DATA_DIR=/app/data
      - INPUT_FORMAT=dicom
      - PYTHONPATH=/app
      - ALLOW_DICOM_MODALITY_FALLBACK=1
      - OLLAMA_URL=http://ollama:11434
      - WEAVIATE_URL=http://weaviate:8080
      - DYNUNET_WEIGHTS_DIR=/workspace/dynunet_weights
      - DYNUNET_WEIGHTS_FILE=model_mri_segmentation.pt

volumes:
  ollama_data:
  weaviate_data:
  dynunet_weights:
  model_cache:
  nilearn_data:
